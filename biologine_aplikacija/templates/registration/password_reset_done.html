{% extends "base_auth.html" %}

{% block content %}
<div class="auth-center-wrap">
<div class="auth-card auth-card-centered">
    <h1 class="auth-title">Check Your Email</h1>

    <p class="auth-message">We've sent password reset instructions to your email address.</p>
    <p class="auth-message-secondary">
        If you don't receive an email within a few minutes, please check your spam folder or try again.
    </p>

    <div class="auth-card-actions">
        <a href="{% url 'login' %}" class="button">Back to Login</a>
    </div>
</div>
</div>
{% endblock %}
