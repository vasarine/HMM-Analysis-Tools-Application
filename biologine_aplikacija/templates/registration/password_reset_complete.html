{% extends "base_auth.html" %}

{% block content %}
<div class="auth-center-wrap">
<div class="auth-card auth-card-centered">
    <div class="auth-glyph">✓</div>
    <h1 class="auth-title">Password Reset Complete</h1>

    <p class="auth-message">Your password has been set successfully!</p>
    <p class="auth-message-secondary">You can now log in with your new password.</p>

    <a href="{% url 'login' %}" class="button">Go to Login</a>
</div>
</div>
{% endblock %}
